name: Check

on:
  push:
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pi: [locked, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: jetify-com/devbox-install-action@v0.12.0
        with:
          enable-cache: true
      - run: devbox run -- npm ci --ignore-scripts
      - name: Test latest Pi
        if: matrix.pi == 'latest'
        run: devbox run -- npm install --no-save --package-lock=false --ignore-scripts @earendil-works/pi-coding-agent@latest @earendil-works/pi-ai@latest
      - run: devbox run -- npm run check
